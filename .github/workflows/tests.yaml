name: PyTest

# Trigger the workflow on pushes or pull requests to main/master
on:
  push:
    branches: [ "redu-dev"]
  pull_request:
    branches: [ "redu-dev"]

jobs:
  test:
    name: Run PyTest Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up the Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install project dependencies & test packages
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      # Step 4: Execute PyTest
      - name: Execute PyTest suite
        run: |
          pytest
